<style>

.title{font-size:clamp(1.9rem,6vw,3.4rem);line-height:1.1;color:var(--gold2);text-shadow:0 0 26px rgba(217,164,65,.45)}

.sub{opacity:.85;max-width:560px}.gold{color:var(--gold2);font:italic 1.35rem Georgia,serif;line-height:1.7}
.tag{font-size:.8rem;letter-spacing:.3em;color:var(--gold)}
#main{width:100%;max-width:940px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;animation:in .7s both}

@keyframes in{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(8px)}}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],p2=n=>String(n).padStart(2,"0"),main=$("#main");

const E=[
{n:"LOUIE BURGER",i:"🍔",d:"Qué curioso que algo que parecía una salida sencilla terminara siendo el comienzo de tantas cosas. Esta fue nuestra primera salida, el momento en que empezamos a conocernos de verdad, sin saber todavía todo lo que vendría después. Y me gusta mirar atrás y saber que ahí empezó una parte muy especial de nuestra historia."},
{n:"COLOMOS",i:"🌿",d:"Después vino Colomos, y creo que aquí fue donde empezaste a encandilarme de verdad. Entre caminar, hablar y estar juntos, hubo esa mezcla de nervios y emoción que no sabes bien cómo explicar cuando alguien empieza a gustarte demasiado. Y sí... aquí llegó nuestro primer beso, así que técnicamente este archivo tiene un nivel de importancia bastante alto."},
{n:"ATLAS",i:"⚽",d:"Nuestro primer partido juntos. Yo iba emocionadísima, probablemente más de lo razonable para un partido, y además terminó apareciendo aquella torta ahogada que intentamos disfrutar como pudimos. Me acuerdo de la emoción de compartir contigo algo que me gustaba, y de verte ahí conmigo, haciendo que un día cualquiera se sintiera mucho más especial."},
{n:"NAVIDALIA",i:"✨",d:"Navidalia fue de esas salidas con un poquito de todo: luces, emoción, mi familia y tú entrando poquito a poquito a una parte más personal de mi mundo. Me acuerdo especialmente de que conocieras a mis dos tíos, de verte conviviendo con ellos y de esa sensación bonita de compartir contigo algo que también era importante para mí."},
{n:"BARRANCA",i:"🌲",d:"Esta salida tuvo un significado diferente. Después de todo lo que había pasado y de decidir que queríamos seguir intentando, estar ahí juntos se sintió como elegirnos otra vez, aunque fuera pasando un día juntos. No necesitaba que ocurriera algo enorme para que significara mucho, y quizá por eso la guardo con muchísimo cariño."},
{n:"MOVIE NIGHT",i:"🎬",d:"Una de esas salidas en las que simplemente queríamos romper la rutina y disfrutar. Película, vino, masaje, mañositos y ese tipo de momentos en los que no hacía falta un gran plan para sentirnos cerquita. Me gusta recordarla por esa complicidad tranquila, de estar juntos sin necesidad de hacer demasiado."},
{n:"BRYAN ADAMS",i:"🎵",d:"Una noche de concierto, música y nosotros compartiendo algo que se sentía especial. Y claro, está Heaven, porque hay canciones que después de ciertos momentos dejan de ser solamente canciones. Esta noche se quedó guardada por la música, por estar contigo y por la sensación de estar viviendo algo que quería recordar."},
{n:"LUNES DE SAN NICO",i:"🌙",d:"Lo bonito de este archivo es que originalmente queríamos que fuera nuestra primera salida... y terminó ganando Louie Burger. Después hasta pensamos que San Nico podía esperar un poquito, porque para una primera salida era demasiado especial. Así que se convirtió en uno de esos planes que tienen historia incluso antes de suceder como los imaginamos."},
{n:"KARTODROMO",i:"🏁",d:"Esta fue curiosa porque cada quien fue por su lado, con sus propios amigos, y aun así pasó algo que me gusta mucho recordar: nos estuvimos hablando, nos extrañamos y terminamos queriendo vernos. A veces esos pequeños momentos dicen muchísimo sin que nadie tenga que decir demasiado."},
{n:"CHARROS",i:"⚾",d:"Una salida mucho más reciente, de esas que se sienten fáciles y bonitas porque simplemente nos divertimos. Comimos muchísimo, nos reímos y pasamos un buen rato juntos. Pero hay una frase tuya que se me quedó guardada: cuando dijiste que trabajabas mucho para poder hacer nuestras salidas. No sé si tú lo recuerdes igual, pero yo sí, porque me hizo sentir muy querida y muy consciente del esfuerzo que había detrás de esos momentos."}];
const A=[
["DETALLE INESPERADO","También me acuerdo de las flores. Y quizá para ti fue simplemente un detalle bonito, pero para mí significó algo más sencillo y más bonito: sentir que habías pensado en mí. Creo que son esas pequeñas cosas las que una termina guardando sin darse cuenta."],
["EL FOTÓGRAFO OFICIAL","También me acuerdo de todas esas veces que terminaste tomando fotos, o incluso preguntándome si quería que me tomaras alguna. Quizá para ti era algo pequeño, pero para mí significaba guardar el momento contigo, y eso siempre me ha gustado muchísimo."],
["VI ESTO Y ME ACORDÉ DE TI","Me acuerdo de esos pequeños detalles, como cuando veías algo de Snoopy o un Kinder Delice y terminabas acordándote de mí. Puede parecer una tontería, pero son justo las cosas que hacen sentir a alguien presente en tu día, incluso cuando no está contigo."],
["TIEMPO DE ESPERA","También me acuerdo de todas esas veces que esperaste mientras yo terminaba de arreglarme. Sé que esperar no parece una gran demostración de cariño, pero para mí sí decía algo: que estabas dispuesto a regalarme un poquito de tu tiempo, incluso cuando podías haber estado haciendo cualquier otra cosa."],
["CONDUCTOR OFICIAL","Y sí, también recuerdo todas esas veces que manejaste para llevarme a algún lugar, recogerme o acompañarme. A veces una se acostumbra a esos pequeños cuidados y no dice suficiente cuánto los aprecia, pero yo sí los vi y sí los guardé."],
["CUANDO NO ME SENTÍA BIEN","Me acuerdo de las veces que, cuando no me sentía bien, buscaste la manera de cuidarme, de conseguir lo que necesitaba o simplemente estar pendiente. Hay formas de cariño que no hacen ruido, pero que se sienten muchísimo."],
["MEMORIA DE XIME","Me acuerdo de todas esas veces que recordaste cosas que yo te había contado, incluso algunas que ya ni esperaba que recordaras. Me hacía sentir escuchada, porque no solamente estabas oyendo lo que decía... estabas poniendo atención."],
["NO ERA MI PLAN","También me acuerdo de esas veces que terminaste acompañándome a cosas que probablemente no estaban en tu lista original de planes. Como Swan Lake. Y creo que es de lo que más bonito se siente en una relación: cuando alguien entra un poquito en tu mundo simplemente porque sabe que para ti significa algo."],
["CHECK-IN","Buenos días, buenas noches, ¿ya llegaste?, avísame cuando estés en casa... Son mensajes pequeños, pero siempre me hicieron sentir acompañada. Es curioso cómo algo que toma solamente unos segundos puede hacer sentir a alguien tan cerquita."],
["OPERACIÓN RESERVACIÓN","También me acuerdo de esas veces que te encargabas de reservar un lugar o preparar un plan. Me gustaba saber que habías pensado un poquito antes en nosotros, en dónde estaríamos y en qué podríamos disfrutar juntos."],
["OBJETO EQUIPADO","Y luego está ese brazalete... porque hay cosas que uno se pone todos los días y simplemente olvida que están ahí, pero otras terminan cargando un poquito de historia. Este definitivamente pertenece a la segunda categoría."]];

document.addEventListener("click",e=>{const b=e.target.closest(".btn");if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement("span"),z=Math.max(r.width,r.height);s.className="rp";s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
function burst(x=innerWidth/2,y=innerHeight/2){for(let i=0;i<22;i++){const d=document.createElement("div");d.className="pt";d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);const a=Math.random()*6.28,r=60+Math.random()*130;d.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px)`,opacity:0}],{duration:900+Math.random()*500,easing:"ease-out"}).onfinish=()=>d.remove()}}
function hearts(n){for(let i=0;i<n;i++)setTimeout(()=>{const h=document.createElement("span");h.className="hr";h.textContent="❤";h.style.left=Math.random()*95+"%";h.style.fontSize=14+Math.random()*16+"px";h.style.animationDuration=3.5+Math.random()*2.5+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),6500)},i*220)}
function addXP(n){const f=document.createElement("div");f.className="fx";f.textContent="+"+n+" XP";document.body.appendChild(f);f.animate([{opacity:1,transform:"translate(-50%,0)"},{opacity:0,transform:"translate(-50%,-90px)"}],{duration:1500}).onfinish=()=>f.remove();const from=xp;xp+=n;const t=Date.now();(function s(){const k=Math.min(1,(Date.now()-t)/900);$("#xpn").textContent=Math.round(from+(xp-from)*k);if(k<1)requestAnimationFrame(s)})();$("#xb").style.width=Math.min(100,xp/60)+"%";S.xp()}
const leo=s=>$("#leo").className=s;
function render(h){main.className="";main.style.animation="none";void main.offsetWidth;main.style.animation="";main.innerHTML=h;scrollTo({top:0,behavior:"smooth"})}
const tr=fn=>{main.className="out";setTimeout(fn,420)};
const cont=(fn,label="CONTINUAR")=>{main.insertAdjacentHTML("beforeend",`<button class="btn big" id="nx">${label}</button>`);$("#nx").onclick=()=>{S.click();tr(fn)}};
/* flujo */
function start(){leo("");render(`<h1 class="title">LEO:<br>MISIÓN DE SUPERVIVENCIA</h1><p class="sub">Una misión especialmente diseñada para ti.</p><div class="glass pad"><p>Hay recuerdos que parecen fáciles...<br>hasta que intentas recordarlos en el orden correcto.</p></div><p class="gold">Observa.<br>Memoriza.<br>Sobrevive.</p>`);cont(ref,"COMENZAR MISIÓN")}
function ref(){render(`<h2>ARCHIVO DE REFERENCIA</h2><p class="sub">Antes de comenzar, conviene conocer el archivo.<br>Después de esto no podrás decir que no te di pistas.</p><div class="grid">`+E.map((e,i)=>`<article class="glass card" style="animation-delay:${i*.09}s"><div class="hd"><span class="num">${p2(i+1)}</span><span class="ic">${e.i}</span></div><h3>${e.n}</h3><p>${e.d}</p></article>`).join("")+`</div>`);cont(ready,"YA ME LAS SÉ — COMENZAR")}
function ready(){render(`<h2 style="line-height:1.6">Perfecto.<br>Ahora sí vamos a ver cuánto recuerdas.</h2>`);setTimeout(()=>tr(level),2600)}
function level(){const L=LV[lv];lvErr=0;leo(L.dis?"focus":"");render(`<p class="tag">${lv==2?"ÚLTIMO NIVEL":"NIVEL "+(lv+1)+" DE 3"}</p><h2>${L.nm}</h2><div class="glass pad"><p>Verás <b>${L.n} salidas</b> durante <b>${L.t} segundos</b>.<br>${L.names?"Verás número y nombre.":"Solo verás el número: recuerda a qué salida corresponde."}<br>Después, tócalas en el mismo orden.</p></div>`);cont(round,"ESTOY LISTO")}
function round(){const L=LV[lv];seq=shuffle([...Array(10).keys()]).slice(0,L.n);pos=0;leo(L.dis?"focus":"");
render(`<h2>${L.nm}</h2><div class="bar"><i id="tb"></i></div><div class="seq">`+seq.map((k,i)=>`<div class="mc ${L.dis?"dis":""}" style="animation-delay:${i*.1}s"><b>${p2(k+1)}</b>${L.names?`<small>${E[k].n}</small>`:""}</div>`).join("")+`</div><p class="sub">Observa y memoriza el orden.</p>`);
const tb=$("#tb");tb.style.transition=`width ${L.t}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>tb.style.width="0%"));setTimeout(recall,L.t*1000)}
function recall(){const L=LV[lv];$$(".mc").forEach(c=>c.classList.add("flip"));setTimeout(()=>{
const pool=shuffle([...new Set([...seq,...shuffle([...Array(10).keys()]).filter(x=>!seq.includes(x))])].slice(0,L.o));
const keep=new Set(seq);const opts=shuffle([...seq,...shuffle([...Array(10).keys()].filter(x=>!keep.has(x))).slice(0,L.o-L.n)]);
render(`<h2>${L.nm}</h2><p class="sub" id="msg">Toca las salidas en el orden en que aparecieron.</p><div class="slots">${seq.map(()=>"<i></i>").join("")}</div><div class="opts">`+opts.map(k=>`<button class="opt" data-k="${k}"><b>${p2(k+1)}</b>${L.names?`<small>${E[k].n}</small>`:L.icons?`<span>${E[k].i}</span>`:""}</button>`).join("")+`</div>`);
t0=Date.now();$$(".opt").forEach(b=>b.onclick=()=>tap(b))},500)}
function tap(b){const k=+b.dataset.k;if(b.disabled)return;
if(k===seq[pos]){b.disabled=true;b.classList.add("good");const s=$$(".slots i")[pos];s.textContent=p2(k+1);s.classList.add("f");pos++;S.ok();if(pos===seq.length)setTimeout(done,500)}
else{$$(".opt").forEach(o=>o.disabled=true);b.classList.add("bad");S.bad();errs++;lvErr++;leo("lose");const m=$("#msg");m.style.color="var(--bad)";m.textContent="Ese no era. Respira, aparece una nueva secuencia y lo intentas otra vez.";setTimeout(round,2200)}}
function done(){const L=LV[lv],b=[[lv==2?"MISIÓN COMPLETADA":"MEMORIA CONFIRMADA",L.xp]];if(!lvErr)b.push(["PERFECT MEMORY",250]);if(Date.now()-t0<L.n*2200)b.push(["SPEED BONUS",100]);
S.lvl();leo("win");burst();render(`<h1 class="title">${lv==2?"MISIÓN COMPLETADA":"MEMORIA CONFIRMADA"}</h1><div id="bl" class="glass pad" style="min-width:min(380px,90%)"></div>`);
b.forEach((x,i)=>setTimeout(()=>{$("#bl").insertAdjacentHTML("beforeend",`<p class="bn">${x[0]} <b>+${x[1]} XP</b></p>`);addXP(x[1]);burst(innerWidth/2,innerHeight/2.4)},500+i*750));
setTimeout(()=>{if(lv==2)cont(fin);else{queue=lv==0?[unlock,unlock,inter]:[unlock,unlock,combo];cont(adv)}},700+b.length*750)}
function adv(){const f=queue.shift();if(f)f();else{lv++;level()}}
function unlock(){const left=A.map((a,i)=>i).filter(i=>!got.includes(i)),i=left[Math.random()*left.length|0];got.push(i);S.unlock();burst();
render(`<p class="tag">ARCHIVO DESBLOQUEADO</p><article class="glass pad" style="max-width:660px"><h2 style="margin-bottom:12px">${A[i][0]}</h2><p style="line-height:1.7;font-size:1.05rem">${A[i][1]}</p><p class="xp" style="margin-top:14px">+200 XP</p></article>`);setTimeout(()=>addXP(200),600);setTimeout(()=>cont(adv),1800)}
function inter(){const k=Math.random()*3|0;
if(k==0){render(`<p class="tag">DATO INNECESARIO PERO IMPORTANTE:</p><h2>hay recuerdos que todavía me hacen sonreír.</h2>`);setTimeout(()=>cont(adv),1200)}
else if(k==1){render(`<p class="tag">BONUS</p><h2>+50 XP<br>porque sí... porque me acordé de ti.</h2>`);setTimeout(()=>addXP(50),500);setTimeout(()=>cont(adv),1500)}
else{render(`<p class="tag">SISTEMA DETECTÓ:</p><h2>demasiados recuerdos guardados.</h2><div id="ch" style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center"><button class="btn" id="b1">ELIMINAR</button><button class="btn" id="b2">NO</button></div>`);
const r=t=>{S.click();$("#ch").outerHTML=`<h2 style="color:var(--gold2)">${t}</h2>`;setTimeout(()=>cont(adv),400)};
$("#b1").onclick=()=>r("MEMORIA CASI LLENA... pero todavía caben algunos recuerdos.");$("#b2").onclick=()=>r("Buena decisión.")}}
function combo(){S.lvl();hearts(14);burst();render(`<p class="tag">COMBO DESBLOQUEADO</p><h1 class="title">"SÍ ME ACUERDO"</h1><p class="xp">+1000 XP</p><div class="glass pad"><p style="line-height:1.8;font-size:1.1rem">No eran grandes gestos.<br><br>Eran muchas cositas pequeñas que, juntas, me hicieron sentir querida.<br><br>Y sí... me acuerdo de ellas. ❤️</p></div>`);setTimeout(()=>addXP(1000),600);setTimeout(()=>cont(adv),2000)}
function fin(){S.lvl();leo("win");hearts(6);let pr=errs==0;
render(`<h1 class="title">MISIÓN COMPLETADA</h1>${pr?'<p class="tag">PERFECT RUN</p><p class="xp">+500 XP</p>':""}<div class="stat"><div class="glass"><small>XP TOTAL</small><b id="c0">0</b></div><div class="glass"><small>NIVEL</small><b>3</b></div><div class="glass"><small>ARCHIVOS DESBLOQUEADOS</small><b>${got.length}</b></div><div class="glass"><small>RECUERDOS ENCONTRADOS</small><b>${got.length+10}</b></div></div><div class="glass pad" style="line-height:1.8"><p class="ln" style="animation-delay:1s">Resulta que sí había muchas cosas que recordar.</p><p class="ln" style="animation-delay:2.4s;margin-top:10px">Algunas grandes.<br>Algunas pequeñitas.<br>Algunas que quizá parecían insignificantes.</p><p class="ln" style="animation-delay:4.2s;margin-top:10px">Pero todas forman parte de algo que para mí fue muy bonito.</p><p class="ln" style="animation-delay:5.6s;margin-top:10px">Gracias por haberlas hecho conmigo. ❤️</p></div>`);
if(pr)setTimeout(()=>addXP(500),700);setTimeout(()=>{const e=$("#c0");if(e)e.textContent=xp},1800);setTimeout(()=>cont(pick),7400)}
function pick(){sel=[];leo("");render(`<p class="tag">ARCHIVO DESBLOQUEADO</p><h2>"¿Y si hacemos memoria otra vez?"</h2><h1 class="title" style="font-size:1.9rem">MISIÓN FINAL</h1><p class="sub">Ya sobreviviste a los recuerdos.<br>Ahora toca algo más sencillo.</p><h3>ELIGE DOS PLANES</h3><div class="slotsP"><div class="glass sl" id="s0"></div><div class="glass sl" id="s1"></div></div><p class="sub" id="hint" style="font-size:.85rem">Toca un plan para elegirlo. Si quieres cambiar, tócalo de nuevo para quitarlo.</p><div class="grid">`+P.map((p,i)=>`<article class="glass card plan" data-i="${i}"><div class="hd"><span class="ic">${p[1]}</span><span class="badge"></span></div><h3>${p[0]}</h3><p>${p[2]}</p></article>`).join("")+`</div><button class="btn big" id="ok" disabled>CONFIRMAR PLANES</button>`);
const upd=()=>{["ESTA SEMANA","LA PRÓXIMA SEMANA"].forEach((t,j)=>{$("#s"+j).innerHTML=`<small>${sel[j]!=null?"✓ "+t:t}</small><b>${sel[j]!=null?P[sel[j]][0]:j?"Selecciona otro":"Selecciona uno"}</b>`});$$(".plan").forEach(c=>{const j=sel.indexOf(+c.dataset.i);c.classList.toggle("sel",j>-1);c.querySelector(".badge").textContent=j==0?"ESTA SEMANA":j==1?"LA PRÓXIMA":""});$("#ok").disabled=sel.length<2};upd();
$$(".plan").forEach(c=>c.onclick=()=>{const i=+c.dataset.i;S.click();if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<2)sel.push(i);else{$("#hint").textContent="Ya elegiste dos. Toca uno para quitarlo y cambiarlo.";return}upd()});
$("#ok").onclick=()=>{S.unlock();tr(confirmP)}}
function confirmP(){burst();render(`<h1 class="title">PLANES CONFIRMADOS</h1><div class="glass pad" style="min-width:min(420px,90%)"><p class="tag">ESTA SEMANA</p><h2>${P[sel[0]][1]} ${P[sel[0]][0]}</h2><br><p class="tag">LA PRÓXIMA SEMANA</p><h2>${P[sel[1]][1]} ${P[sel[1]][0]}</h2></div><p class="gold">Perfecto.<br>Ahora sí hay misión nueva.</p>`);cont(final)}
function final(){S.lvl();hearts(8);leo("win");render(`<h1 class="title">MISIÓN COMPLETADA</h1><h2>DOS PLANES DESBLOQUEADOS</h2><div class="glass pad" style="min-width:min(420px,90%);line-height:2"><p>Esta semana:<br><b style="color:var(--gold2);font-size:1.3rem">❤️ ${P[sel[0]][0]}</b></p><p>La próxima:<br><b style="color:var(--gold2);font-size:1.3rem">❤️ ${P[sel[1]][0]}</b></p></div><p style="font-size:1.1rem">Ahora haz captura de tus dos elecciones<br>y mándamela. 😌</p><p class="sub">📸 Haz captura de esta pantalla y mándamela.</p><p class="gold" style="margin-top:12px">Creo que algunas cosas merecen una segunda vuelta.</p>`)}
/* fondo: estrellas y partículas */
(function(){const c=$("#bg"),x=c.getContext("2d");let W,H,st=[];const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;st=Array.from({length:Math.min(140,W/8)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,v:Math.random()*.25+.05,g:Math.random()<.25,p:Math.random()*6}))};rs();addEventListener("resize",rs);
(function f(t){x.clearRect(0,0,W,H);st.forEach(s=>{s.y-=s.v*(s.g?1:.3);if(s.y<-5){s.y=H+5;s.x=Math.random()*W}const a=.35+.35*Math.sin(t/900+s.p);x.fillStyle=s.g?`rgba(240,200,112,${a})`:`rgba(243,234,216,${a})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()});requestAnimationFrame(f)})(0)})();
/* avión ocasional */
const pl=$("#plane");setInterval(()=>{pl.style.top=8+Math.random()*22+"%";pl.classList.remove("fly");void pl.getBoundingClientRect();pl.classList.add("fly")},24000);setTimeout(()=>pl.classList.add("fly"),4000);
start();
</script></body></html>
